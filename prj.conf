# ── Application ────────────────────────────────────────────────────────────────
CONFIG_CYBERBRICK_WIFI_SSID="cyberbrick"
CONFIG_CYBERBRICK_WIFI_PASSWORD="cyberbrick"
CONFIG_CYBERBRICK_WEB_PORT=80

# ── Heap / stack ────────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536

# ── GPIO ────────────────────────────────────────────────────────────────────────
CONFIG_GPIO=y

# ── PWM (LEDC on ESP32-S3) ──────────────────────────────────────────────────────
CONFIG_PWM=y

# ── Networking ──────────────────────────────────────────────────────────────────
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONTEXT_RCVTIMEO=y

CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_DATA_SIZE=1280

CONFIG_NET_MAX_CONTEXTS=24
CONFIG_NET_MAX_CONN=24
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=8

# Recycle TIME_WAIT sockets quickly so contexts don't linger.
CONFIG_NET_TCP_TIME_WAIT_DELAY=250

# Required so net_mgmt callbacks receive the event payload via cb->info
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

# ── WiFi (SoftAP mode) ─────────────────────────────────────────────────────────
CONFIG_WIFI=y
CONFIG_WIFI_USAGE_MODE_AP=y
CONFIG_WIFI_LOG_LEVEL_WRN=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_WIFI_SHELL=n

# ── Net logs (keep INF; flip to DBG if Wi-Fi misbehaves) ────────────────────────
CONFIG_NET_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096

# ── ESP32 WiFi driver ───────────────────────────────────────────────────────────
# (No auto-DHCPv4 client — we run a DHCP server instead.)

# ── Logging ─────────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# ── Console (USB-Serial/JTAG on ESP32-S3) ──────────────────────────────────────
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# ── Shell (servo / motor commands) ────────────────────────────────────────────────
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="cyberbrick:~$ "
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_KERNEL_SHELL=y

# ── Threads ─────────────────────────────────────────────────────────────────────
CONFIG_THREAD_NAME=y
CONFIG_POSIX_API=y
